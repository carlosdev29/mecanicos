name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Iniciar sesión en Docker Hub de forma segura usando tus Secrets de GitHub
    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Construir la imagen y subirla a tu repositorio de Docker Hub
    - name: Construir y subir imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          carlossanzdev48/pegasus-mechanic-service:latest
          carlossanzdev48/pegasus-mechanic-service:${{ github.sha }}
